name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  source:
    name: Verify release ancestry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a release tag on main history
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/main

      - name: Require a stable version
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ ${#GITHUB_REF_NAME} -le 40 ]]

  verify:
    name: Verify the exact release tree
    needs: source
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml

  build-release:
    needs: verify
    permissions:
      contents: write
    timeout-minutes: 30
    name: Build & Package Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          check-latest: true

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0 ndk;28.2.13676358'

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Build release binaries
        env:
          CGO_ENABLED: '0'
          TAG: ${{ github.ref_name }}
          FOCUSGATE_NEON_AUTH_URL: ${{ vars.FOCUSGATE_NEON_AUTH_URL }}
          FOCUSGATE_SYNC_URL: ${{ vars.FOCUSGATE_SYNC_URL }}
          FOCUSGATE_ASSESSMENT_URL: ${{ vars.FOCUSGATE_ASSESSMENT_URL }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?Android release keystore is required}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Android keystore password is required}"
          : "${ANDROID_KEY_ALIAS:?Android signing key alias is required}"
          : "${ANDROID_KEY_PASSWORD:?Android signing key password is required}"
          keystore="$(mktemp)"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"

          mkdir -p dist artifacts
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          LDFLAGS="-s -w -X focusgate/internal/version.Version=${TAG} -X focusgate/internal/version.Commit=${SHORT_SHA} -X focusgate/internal/version.Date=${BUILD_DATE}"

          # Linux amd64
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/focusgate ./cmd/focusgate
          tar -czvf "artifacts/focusgate-${TAG}-linux-amd64.tar.gz" -C dist focusgate -C ../ focusgate.example.yaml README.md

          # Linux arm64
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/focusgate ./cmd/focusgate
          tar -czvf "artifacts/focusgate-${TAG}-linux-arm64.tar.gz" -C dist focusgate -C ../ focusgate.example.yaml README.md

          # macOS amd64
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/focusgate ./cmd/focusgate
          tar -czvf "artifacts/focusgate-${TAG}-darwin-amd64.tar.gz" -C dist focusgate -C ../ focusgate.example.yaml README.md

          # macOS arm64 (Apple Silicon)
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/focusgate ./cmd/focusgate
          tar -czvf "artifacts/focusgate-${TAG}-darwin-arm64.tar.gz" -C dist focusgate -C ../ focusgate.example.yaml README.md

          # Windows amd64
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/focusgate.exe ./cmd/focusgate
          zip -j "artifacts/focusgate-${TAG}-windows-amd64.zip" dist/focusgate.exe focusgate.example.yaml README.md

          # Android arm64 (Phone / Termux binary)
          GOOS=android GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/focusgate ./cmd/focusgate
          tar -czvf "artifacts/focusgate-${TAG}-android-arm64.tar.gz" -C dist focusgate -C ../ focusgate.example.yaml README.md

          # Build and sign the native app with the persistent release key.
          FOCUSGATE_APP_VERSION="${TAG#v}" FOCUSGATE_ANDROID_KEYSTORE="$keystore" bash scripts/build-android.sh release

          # Generate SHA256 Checksums
          cd artifacts
          sha256sum -- * > checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
