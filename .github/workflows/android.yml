name: Build Native Android APK

on:
  push:
    branches: [main]
    paths:
      - 'cmd/focusgate-mobile/**'
      - 'internal/mobile/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Package Android APK (No Docker)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          check-latest: true
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Install Fyne Packaging CLI
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Package Native Android APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Use latest pre-installed Android NDK if path varies
          if [ ! -d "$ANDROID_NDK_HOME" ]; then
            export ANDROID_NDK_HOME=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          fi
          echo "Using Android NDK: $ANDROID_NDK_HOME"
          cd cmd/focusgate-mobile
          fyne package -os android -appID xyz.sandoxed.focusgate -appVersion 1.0.0 -appBuild "${GITHUB_RUN_NUMBER:-1}" -icon ../../internal/web/static/icon-512.png -name FocusGate

          APKSIGNER=$(find /usr/local/lib/android/sdk/build-tools -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "Error: apksigner not found in Android build-tools" >&2
            exit 1
          fi

          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "Signing APK with configured repository release keystore..."
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > release.keystore
            KS_PASS="${ANDROID_KEYSTORE_PASSWORD}"
            KEY_ALIAS="${ANDROID_KEY_ALIAS}"
            KEY_PASS="${ANDROID_KEY_PASSWORD}"
          else
            echo "No custom keystore secret provided; generating dedicated release keystore..."
            keytool -genkeypair -v -keystore release.keystore -alias focusgate -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "focusgate-release" -keypass "focusgate-release" \
              -dname "CN=FocusGate, OU=Mobile, O=Sandoxed, L=Cloud, ST=Global, C=US"
            KS_PASS="focusgate-release"
            KEY_ALIAS="focusgate"
            KEY_PASS="focusgate-release"
          fi

          "$APKSIGNER" sign --ks release.keystore --ks-pass "pass:${KS_PASS}" --ks-key-alias "${KEY_ALIAS}" --key-pass "pass:${KEY_PASS}" FocusGate.apk
          "$APKSIGNER" verify --verbose FocusGate.apk
          rm -f release.keystore
          mv FocusGate.apk ../../focusgate.apk || mv *.apk ../../focusgate.apk
          cd ../..
          ls -lh focusgate.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: focusgate-apk
          path: "*.apk"
          if-no-files-found: error
