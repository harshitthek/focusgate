name: Build Native Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'androidbridge/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/build-android.sh'
      - 'scripts/android-bind/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: android-preview-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  plan:
    uses: ./.github/workflows/ci-plan.yml

  build-apk:
    name: Build and verify preview APK
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          check-latest: true
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0 ndk;28.2.13676358'

      - name: Package Native Android Preview APK
        run: |
          bash scripts/build-android.sh preview
          sha256sum focusgate-preview.apk > focusgate-preview.apk.sha256

      - name: Enable delegated access to KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test phone storage and work scheduling on Android
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          script: bash android/gradlew -p android --no-daemon :app:connectedDebugAndroidTest

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: focusgate-preview-apk
          path: |
            focusgate-preview.apk
            focusgate-preview.apk.sha256
          if-no-files-found: error

  preview-required:
    name: ${{ github.event_name == 'pull_request' && 'Android preview (PR)' || 'Android preview' }}
    if: ${{ always() }}
    needs: [plan, build-apk]
    timeout-minutes: 3
    runs-on: ubuntu-latest
    steps:
      - name: Report the planned Android result
        shell: bash
        env:
          PLAN: ${{ needs.plan.result }}
          MODE: ${{ needs.plan.outputs.mode }}
          APK: ${{ needs.build-apk.result }}
        run: |
          printf '### Android preview (%s)\n\nAPK job: %s\n' "$MODE" "$APK" >> "$GITHUB_STEP_SUMMARY"
          [[ "$PLAN" == success ]]
          case "$MODE" in
            full) [[ "$APK" == success ]] ;;
            docs) [[ "$APK" == skipped ]] ;;
            *) exit 1 ;;
          esac
