name: Build Native Android APK

on:
  push:
    branches: [main]
    paths:
      - 'cmd/focusgate-mobile/**'
      - 'internal/mobile/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Package Android APK (No Docker)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          check-latest: true
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Install Fyne Packaging CLI
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Package Native Android APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?Android release keystore is required}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Android keystore password is required}"
          : "${ANDROID_KEY_ALIAS:?Android signing key alias is required}"
          : "${ANDROID_KEY_PASSWORD:?Android signing key password is required}"
          keystore="$(mktemp)"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"

          # Use latest pre-installed Android NDK if path varies
          if [ ! -d "$ANDROID_NDK_HOME" ]; then
            export ANDROID_NDK_HOME=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          fi
          echo "Using Android NDK: $ANDROID_NDK_HOME"
          cd cmd/focusgate-mobile
          fyne package -os android -appID xyz.sandoxed.focusgate.preview -appVersion 1.0.0 -appBuild "${GITHUB_RUN_NUMBER:-1}" -icon ../../internal/web/static/icon-512.png -name FocusGate

          APKSIGNER=$(find /usr/local/lib/android/sdk/build-tools -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "Error: apksigner not found in Android build-tools" >&2
            exit 1
          fi

          "$APKSIGNER" sign --ks "$keystore" --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" --key-pass env:ANDROID_KEY_PASSWORD FocusGate.apk
          "$APKSIGNER" verify --verbose FocusGate.apk
          mv FocusGate.apk ../../focusgate.apk || mv *.apk ../../focusgate.apk
          cd ../..
          ls -lh focusgate.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: focusgate-apk
          path: "*.apk"
          if-no-files-found: error
