name: Build Native Android APK

on:
  push:
    branches: [main]
    paths:
      - 'cmd/focusgate-mobile/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: android-preview-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  plan:
    uses: ./.github/workflows/ci-plan.yml

  build-apk:
    name: Build and verify preview APK
    needs: plan
    if: needs.plan.outputs.mode == 'basic' || needs.plan.outputs.mode == 'full'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          check-latest: true
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Install Fyne Packaging CLI
        run: go install fyne.io/tools/cmd/fyne@v1.7.4

      - name: Package Native Android Preview APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
        run: |
          # Use latest pre-installed Android NDK if path varies
          if [ ! -d "$ANDROID_NDK_HOME" ]; then
            ANDROID_NDK_HOME=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
            export ANDROID_NDK_HOME
          fi
          test -d "$ANDROID_NDK_HOME"
          echo "Using Android NDK: $ANDROID_NDK_HOME"
          cd cmd/focusgate-mobile
          fyne package -os android -appID xyz.sandoxed.focusgate.preview -appVersion 1.0.0 -appBuild "${GITHUB_RUN_NUMBER:-1}" -icon ../../internal/web/static/icon-512.png -name FocusGate

          APKSIGNER=$(find /usr/local/lib/android/sdk/build-tools -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "Error: apksigner not found in Android build-tools" >&2
            exit 1
          fi

          # Fyne's development signature is sufficient for this isolated preview app.
          "$APKSIGNER" verify --verbose FocusGate.apk
          mv FocusGate.apk ../../focusgate-preview.apk
          cd ../..
          ls -lh focusgate-preview.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: focusgate-preview-apk
          path: focusgate-preview.apk
          if-no-files-found: error

  preview-required:
    name: ${{ github.event_name == 'pull_request' && 'Android preview (PR)' || 'Android preview' }}
    if: ${{ always() }}
    needs: [plan, build-apk]
    timeout-minutes: 3
    runs-on: ubuntu-latest
    steps:
      - name: Report the planned Android result
        shell: bash
        env:
          PLAN: ${{ needs.plan.result }}
          MODE: ${{ needs.plan.outputs.mode }}
          APK: ${{ needs.build-apk.result }}
        run: |
          printf '### Android preview (%s)\n\nAPK job: %s\n' "$MODE" "$APK" >> "$GITHUB_STEP_SUMMARY"
          [[ "$PLAN" == success ]]
          case "$MODE" in
            basic|full) [[ "$APK" == success ]] ;;
            docs|skip) [[ "$APK" == skipped ]] ;;
            *) exit 1 ;;
          esac
