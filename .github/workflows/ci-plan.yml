name: Plan CI

on:
  workflow_call:
    outputs:
      mode:
        description: Validation tier selected for this tree
        value: ${{ jobs.plan.outputs.mode }}

permissions:
  contents: read
  pull-requests: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - name: Check out the build tree and its base
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read the current PR CI labels
        id: labels
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mode=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '
            if any(.labels[]; (.name | ascii_downcase) == "ci:full") then "full"
            elif any(.labels[]; (.name | ascii_downcase) == "ci:skip") then "skip"
            else "basic"
            end')
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Select validation tier
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_MODE: ${{ steps.labels.outputs.mode }}
        run: bash scripts/ci-plan.sh "$EVENT" "$BASE_SHA" "$PR_MODE"
