name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  hygiene:
    name: Code Hygiene & Vet
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          check-latest: true
          cache: true

      - name: Install Linux GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Verify Go format (gofmt)
        run: |
          UNFORMATTED=$(gofmt -s -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not formatted with gofmt -s:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

  test:
    name: Test (${{ matrix.os }})
    needs: hygiene
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          check-latest: true
          cache: true

      - name: Install Linux GUI build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Run tests with race detector
        if: matrix.os != 'windows-latest'
        run: go test -v -race -count=1 ./...

      - name: Run tests (Windows)
        if: matrix.os == 'windows-latest'
        run: go test -v -count=1 ./...

      - name: Verify Windows task removal
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/install-windows-task_test.ps1

      - name: Verify dashboard account transitions
        run: node --test internal/web/app_test.cjs

  cross-compile:
    name: Cross-Compile (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: focusgate-linux-amd64
          - goos: linux
            goarch: arm64
            output: focusgate-linux-arm64
          - goos: windows
            goarch: amd64
            output: focusgate-windows-amd64.exe
          - goos: darwin
            goarch: amd64
            output: focusgate-darwin-amd64
          - goos: darwin
            goarch: arm64
            output: focusgate-darwin-arm64
          - goos: android
            goarch: arm64
            output: focusgate-android-arm64
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          check-latest: true
          cache: true

      - name: Compile static binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          go build -trimpath -ldflags="-s -w -X focusgate/internal/version.Version=ci -X focusgate/internal/version.Commit=${SHORT_SHA} -X focusgate/internal/version.Date=${BUILD_DATE}" -o dist/${{ matrix.output }} ./cmd/focusgate
          ls -lh dist/${{ matrix.output }}
