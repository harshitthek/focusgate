name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  plan:
    uses: ./.github/workflows/ci-plan.yml

  hygiene:
    name: Code Hygiene & Vet
    needs: plan
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          check-latest: true
          cache: true

      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Install Linux GUI build dependencies
        if: needs.plan.outputs.mode == 'full'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Verify Go format (gofmt)
        if: needs.plan.outputs.mode == 'full'
        run: |
          UNFORMATTED=$(gofmt -s -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not formatted with gofmt -s:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run go vet
        if: needs.plan.outputs.mode == 'full'
        run: go vet ./...

  test:
    name: Test (${{ matrix.os }})
    needs: [plan, hygiene]
    if: needs.plan.outputs.mode == 'full'
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          check-latest: true
          cache: true

      - name: Install Linux GUI build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Run tests with race detector
        if: matrix.os != 'windows-latest'
        run: go test -v -race -count=1 ./...

      - name: Run tests (Windows)
        if: matrix.os == 'windows-latest'
        run: go test -v -count=1 ./...

      - name: Verify Windows task removal
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/install-windows-task_test.ps1

      - name: Verify dashboard account transitions
        run: node --test internal/web/app_test.cjs

  cross-compile:
    name: Cross-Compile (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: focusgate-linux-amd64
          - goos: linux
            goarch: arm64
            output: focusgate-linux-arm64
          - goos: windows
            goarch: amd64
            output: focusgate-windows-amd64.exe
          - goos: darwin
            goarch: amd64
            output: focusgate-darwin-amd64
          - goos: darwin
            goarch: arm64
            output: focusgate-darwin-arm64
          - goos: android
            goarch: arm64
            output: focusgate-android-arm64
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          check-latest: true
          cache: true

      - name: Compile static binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          go build -trimpath -ldflags="-s -w -X focusgate/internal/version.Version=ci -X focusgate/internal/version.Commit=${SHORT_SHA} -X focusgate/internal/version.Date=${BUILD_DATE}" -o dist/${{ matrix.output }} ./cmd/focusgate
          ls -lh dist/${{ matrix.output }}

  pr-required:
    name: ${{ github.event_name == 'pull_request' && 'CI required (PR)' || 'CI summary' }}
    if: ${{ always() }}
    needs: [plan, hygiene, test, cross-compile]
    timeout-minutes: 3
    runs-on: ubuntu-latest
    steps:
      - name: Require the planned jobs to succeed
        shell: bash
        env:
          PLAN: ${{ needs.plan.result }}
          MODE: ${{ needs.plan.outputs.mode }}
          HYGIENE: ${{ needs.hygiene.result }}
          TESTS: ${{ needs.test.result }}
          CROSS_COMPILE: ${{ needs.cross-compile.result }}
        run: |
          {
            printf '### CI results (%s)\n\n' "$MODE"
            printf -- '- Plan: %s\n- Hygiene: %s\n- Tests: %s\n- Cross-compiles: %s\n' "$PLAN" "$HYGIENE" "$TESTS" "$CROSS_COMPILE"
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$PLAN" == success && "$HYGIENE" == success ]]
          case "$MODE" in
            full) [[ "$TESTS" == success && "$CROSS_COMPILE" == success ]] ;;
            docs) [[ "$TESTS" == skipped && "$CROSS_COMPILE" == skipped ]] ;;
            *) exit 1 ;;
          esac
