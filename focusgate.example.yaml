server:
  # For remote access, keep this listener behind an HTTPS proxy or encrypted tunnel.
  # Configure FOCUSGATE_AUTH_TOKEN and FOCUSGATE_WEBHOOK_SECRET before exposing it.
  listen: "127.0.0.1:8787"
  # Set to the protected public address for links from ntfy to the PWA.
  public_url: "http://127.0.0.1:8787"
  # Optional token protecting API/PWA access (supports ${ENV_VAR} expansion)
  auth_token: "${FOCUSGATE_AUTH_TOKEN}"
  # Enable remote self-registration after admin setup.
  # Loopback-only installations still allow local signup when false.
  allow_registration: false
  # Optional proxy socket IPs allowed to supply X-Real-IP for credential quotas.
  # The proxy must overwrite this header with the actual client IP.
  trusted_proxy_ips: []

storage:
  path: "./data/focusgate.db"
  retention_days: 14
  max_snippet_chars: 1200

focus:
  # Modes: normal | deep_work | dnd
  default_mode: "normal"
  # Local 24h HH:MM times when queued digest items are batched and sent
  digest_times:
    - "09:00"
    - "13:30"
    - "19:30"
  # Concise context sent to Stage-2 semantic classifier for ambiguous items
  user_context: "Software developer working on backend systems and open-source tools. Urgent production alerts, direct review requests, and personal messages matter; newsletters and marketing do not."

classifier:
  # hybrid = Stage-1 local rules first, Stage-2 TypeSafe System One API for ambiguous items
  # rules_only = 100% offline deterministic rules + keyword heuristic
  mode: "hybrid"
  typesafe_api_key: "${TYPESAFE_API_KEY}"
  typesafe_base_url: "https://api.typesafe.ai"
  model: "jev-latest"
  timeout_seconds: 10
  max_daily_api_calls: 200
  max_daily_api_calls_per_user: 20

notify:
  ntfy:
    enabled: false
    server: "https://ntfy.sh"
    topic: "focusgate-change-this-secret-topic"
    token: "${NTFY_TOKEN}"
  desktop_windows:
    enabled: true
  slack:
    enabled: false
    webhook_url: "${SLACK_WEBHOOK_URL}"
    mention_handle: "<@U12345678>"
  matrix:
    enabled: false
    webhook_url: "${MATRIX_WEBHOOK_URL}"
    mention_handle: "@user:matrix.org"
  # When true, external notifications only buzz when your handle is @mentioned, reviewed, or assigned
  only_mentions: false
  mention_handles:
    - "@yourusername"
    - "yourname"

sources:
  rss:
    - name: "Go Blog"
      url: "https://go.dev/blog/feed.atom"
      tag: "dev"
      poll_minutes: 60
    - name: "Lobsters"
      url: "https://lobste.rs/rss"
      tag: "tech"
      poll_minutes: 30

  github:
    # GitHub notifications can also be linked dynamically via the Web PWA Profile drawer
    # using 1-click GitHub Device Flow or a classic PAT without editing this file.
    enabled: false
    token: "${GITHUB_TOKEN}"
    poll_minutes: 5
    participating_only: true

  imap:
    - name: "Personal Email"
      enabled: false
      host: "imap.gmail.com"
      port: 993
      username: "you@gmail.com"
      password: "${IMAP_APP_PASSWORD}"
      mailbox: "INBOX"
      poll_minutes: 5

  webhook:
    enabled: true
    secret: "${FOCUSGATE_WEBHOOK_SECRET}"

rules:
  - name: "Tech Feeds Always Digest"
    source_type: "rss"
    action: "queue_digest"
  - name: "Security & Outage Keywords"
    regex: "(?i)\\b(outage|sev1|incident|cve-|security alert|production down)\\b"
    action: "push_now"
    priority: 5
  - name: "GitHub Direct Review or Mention"
    source_type: "github"
    github_reason: "review_requested,mention,assign,security_alert"
    action: "smart"
  - name: "GitHub CI & Subscribed Noise"
    source_type: "github"
    github_reason: "ci_activity,subscribed"
    action: "queue_digest"
  - name: "Unsubscribe / Marketing Filter"
    source_type: "imap"
    regex: "(?i)(unsubscribe|weekly digest|promo|sale ends)"
    action: "archive"
